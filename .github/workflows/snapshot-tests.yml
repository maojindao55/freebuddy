name: Snapshot regressions

on:
  push:
    paths:
      - 'electron/cli/turnFileSnapshot*.ts'
      - 'tests/turn-file-snapshot-process.test.mjs'
      - '.github/workflows/snapshot-tests.yml'
  pull_request:
    paths:
      - 'electron/cli/turnFileSnapshot*.ts'
      - 'tests/turn-file-snapshot-process.test.mjs'
      - '.github/workflows/snapshot-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Match Release, including native module installation and Electron DB tests.
      - run: npm ci
      - run: npm test
