# Default standalone Cordis configuration for deepseek-harness-acp

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: !!js "process.env.DEEPSEEK_API_KEY_ENV ?? 'DEEPSEEK_API_KEY'"
    baseURL: !!js "process.env.DEEPSEEK_BASE_URL ?? undefined"
    models: !!js "(() => { const defaultCatalog = [{ id: 'deepseek-flash', name: 'DeepSeek Flash', contextWindow: 1000000, inputModalities: ['text', 'image'] }, { id: 'deepseek-v4-pro', name: 'DeepSeek V4 Pro', contextWindow: 1000000, inputModalities: ['text'] }, { id: 'deepseek-chat', name: 'DeepSeek Chat', contextWindow: 1000000, inputModalities: ['text'] }, { id: 'deepseek-reasoner', name: 'DeepSeek Reasoner', contextWindow: 1000000, inputModalities: ['text'] }]; if (process.env.DEEPSEEK_MODELS_JSON) { try { const parsed = JSON.parse(process.env.DEEPSEEK_MODELS_JSON); if (Array.isArray(parsed) && parsed.length > 0) { return parsed.map((m) => { const id = m.id?.toLowerCase() || ''; const isVision = id.includes('v4.1') || id.includes('vision') || (id.includes('flash') && !id.includes('v4-flash-pro')); if (isVision && (!m.inputModalities || !m.inputModalities.includes('image'))) { return { ...m, inputModalities: ['text', 'image'] }; } return m; }); } } catch {} } return defaultCatalog; })()"
    thinking: enabled
    reasoningEffort: max

- id: attachment-local
  name: '@deepseek-ai/dsh-attachment-local'

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'

- id: sandbox-policy
  name: '@deepseek-ai/dsh-sandbox-policy'
  config:
    mode: !!js "process.env.DSH_PERMISSION_MODE ?? 'workspace-write'"
    workspaceRoot: !!js process.cwd()

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: bash
  name: '@deepseek-ai/dsh-bash-sandbox'
  config:
    timeoutMs: 60000

- id: approval
  name: '@deepseek-ai/dsh-user-approval'
  config:
    policy: !!js "process.env.DSH_PERMISSION_MODE === 'danger-full-access' ? 'never' : 'ask'"

- id: acp-agent
  name: '@deepseek-ai/dsh-acp-demo'
  config:
    provider: deepseek-official
    model: !!js "process.env.DEEPSEEK_MODEL ?? process.env.DSH_MODEL ?? 'deepseek-v4-flash-vision-exp'"
    persistenceRoot: !!js "process.env.DSH_SESSIONS_ROOT ?? './.sessions'"
    persistenceCompression: none
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.
      Verify your work by running the code or tests. Keep answers brief and factual.

- id: token-meter
  name: '@deepseek-ai/dsh-token-meter'

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    retainRatio: 0.08
    maxTokens: 8192
    compactionRetries: 1

- id: session-projection
  name: '@deepseek-ai/dsh-session-projection'

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  config:
    cwd: !!js process.cwd()

- id: fs-observation-policy
  name: '@deepseek-ai/dsh-fs-observation-policy'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true
